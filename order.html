<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="container">
      <a href="index.html" class="logo">หน้าแรก</a>
    </nav>
  </header>

  <main class="container order-page">
    <section class="section order-section">
      <h1>สั่งซื้อสินค้า</h1>
      <p class="section-lead">กรอกรายละเอียดด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>

      <form id="orderForm" class="order-form">
        <div class="form-group">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" required autocomplete="tel">
        </div>

        <div class="form-group">
          <label for="items">รายการสินค้า</label>
          <textarea id="items" name="items" rows="3" required placeholder="เช่น Peach Blossom Infusion x 2"></textarea>
        </div>

        <div class="form-group">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="number" id="total" name="total" min="0" step="1" required inputmode="numeric">
        </div>

        <div class="form-group">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">ยืนยันสั่งซื้อ</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
